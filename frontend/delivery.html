<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة شركة التوصيل - X Cash</title>
    <link rel="stylesheet" href="rtl-style.css">
</head>
<body>

    <!-- شريط العناوين -->
    <header style="padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #D4AF37;">
        <h1 style="color: #D4AF37; margin: 0;">🚚 لوحة إدارة التوصيل</h1>
        <a href="index.html" style="color: #E5C158; text-decoration: none;">الرئيسية 🏠</a>
    </header>

    <!-- قائمة الشحنات للشركة والمندوبين -->
    <main style="max-width: 800px; margin: 40px auto; padding: 20px;">
        <div class="wallet-card">
            <h2 style="color: #E5C158; margin-bottom: 20px;">طلبات التوصيل المتاحة</h2>
            
            <!-- نموذج بطاقة طلب شحنة -->
            <div style="background: #0F0F12; border: 1px solid #333; padding: 15px; border-radius: 8px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h4 style="margin: 0 0 5px 0; color: #FFF;">شحنة رقم #XC-9821</h4>
                    <p style="margin: 0; color: #AAA; font-size: 14px;">رسوم التوصيل: <strong style="color: #D4AF37;">15 X Cash</strong></p>
                </div>
                <button class="btn-gold" style="padding: 8px 16px; font-size: 14px;">قبول الشحنة</button>
            </div>
        </div>
    </main>

</body>
</html>
