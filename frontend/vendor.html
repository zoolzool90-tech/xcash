<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة المسوق والتاجر - X Cash</title>
    <link rel="stylesheet" href="rtl-style.css">
</head>
<body>

    <!-- شريط العناوين -->
    <header style="padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #D4AF37;">
        <h1 style="color: #D4AF37; margin: 0;">🛍️ لوحة التاجر والمسوق</h1>
        <a href="index.html" style="color: #E5C158; text-decoration: none;">الرئيسية 🏠</a>
    </header>

    <!-- نموذج إضافة منتج جديد -->
    <main style="max-width: 600px; margin: 40px auto; padding: 20px;">
        <div class="wallet-card">
            <h2 style="color: #E5C158;">إضافة منتج جديد</h2>
            <form id="productForm">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; color: #AAA;">اسم المنتج:</label>
                    <input type="text" id="prodTitle" required style="width: 100%; padding: 10px; background: #0F0F12; border: 1px solid #D4AF37; color: #FFF; border-radius: 5px;">
                </div>
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px; color: #AAA;">السعر بـ X Cash:</label>
                    <input type="number" id="prodPrice" required style="width: 100%; padding: 10px; background: #0F0F12; border: 1px solid #D4AF37; color: #FFF; border-radius: 5px;">
                </div>
                <button type="submit" class="btn-gold" style="width: 100%;">نشر المنتج</button>
            </form>
        </div>
    </main>

</body>
</html>
