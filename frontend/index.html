<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X Cash Platform</title>
    <link rel="stylesheet" href="rtl-style.css">
</head>
<body>

    <!-- شريط العناوين واختيار اللغة -->
    <header style="padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #D4AF37;">
        <h1 style="color: #D4AF37; margin: 0;">👑 X Cash</h1>
        <div>
            <label for="langSelect" style="color: #E5C158;">اللغة / Language: </label>
            <select id="langSelect" style="background: #1A1A1E; color: #FFF; border: 1px solid #D4AF37; padding: 5px; border-radius: 5px;">
                <option value="ar">العربية (RTL)</option>
                <option value="en">English (LTR)</option>
                <option value="fr">Français (LTR)</option>
                <option value="es">Español (LTR)</option>
                <option value="de">Deutsch (LTR)</option>
            </select>
        </div>
    </header>

    <!-- بطاقة المحفظة الرئيسية -->
    <main style="max-width: 600px; margin: 40px auto; padding: 20px;">
        <div class="wallet-card">
            <h2 id="walletTitle" style="color: #E5C158;">رصيد المحفظة</h2>
            <div style="font-size: 32px; font-weight: bold; margin: 15px 0; color: #FFF;">
                <span id="balance">0.00</span> <span style="color: #D4AF37;">X Cash</span>
            </div>
            <p id="rateNotice" style="color: #AAA; font-size: 14px;">1 دولار = 10 X Cash</p>
            <button class="btn-gold" id="buyBtn" style="margin-top: 15px; width: 100%;">شراء X Cash</button>
        </div>
    </main>

    <!-- ربط ملف التفاعل الجافاسكريبت -->
    <script src="app.js"></script>
</body>
</html>
