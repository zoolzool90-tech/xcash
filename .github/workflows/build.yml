name: Build Android Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'

      - name: Generate Keystore and Dummy Launcher Icon
        run: |
          mkdir -p mobile_app/android/app/src/main/res/mipmap-hdpi
          mkdir -p mobile_app/android/app/src/main/res/mipmap-mdpi
          mkdir -p mobile_app/android/app/src/main/res/mipmap-xhdpi
          mkdir -p mobile_app/android/app/src/main/res/mipmap-xxhdpi
          mkdir -p mobile_app/android/app/src/main/res/mipmap-xxxhdpi
          
          # توليد مفتاح التوقيع
          keytool -genkey -v -keystore mobile_app/android/app/key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass 123456 -keypass 123456 -dname "CN=Walid, OU=Xcash, O=Xcash, L=Dubai, ST=Dubai, C=AE"

          # إنشاء ملفات أيقونات فارغة لمنع خطأ AAPT
          touch mobile_app/android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          touch mobile_app/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          touch mobile_app/android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          touch mobile_app/android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          touch mobile_app/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Install Dependencies
        run: |
          cd mobile_app
          flutter pub get

      - name: Build Android App Bundle (.aab)
        run: |
          cd mobile_app
          flutter build appbundle --release

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: mobile_app/build/app/outputs/bundle/release/app-release.aab
