name: Build Flutter App (APK & AAB)

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build App Bundles and APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'

      - name: Install Project Dependencies
        run: flutter pub get
        working-directory: mobile_app

      - name: Build Android App Bundle (AAB for Google Play)
        run: flutter build appbundle --release
        working-directory: mobile_app

      - name: Build Android APK (For Mobile Testing)
        run: flutter build apk --release
        working-directory: mobile_app

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: mobile_app/build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk
