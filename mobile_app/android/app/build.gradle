plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// توليد ملف الـ Keystore تلقائياً عبر Gradle قبل البناء لضمان عدم ضياعه
def keystoreFile = file('key.jks')
if (!keystoreFile.exists()) {
    println ">>> Generating Keystore automatically via Gradle..."
    def command = "keytool -genkey -v -keystore key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass 123456 -keypass 123456 -dname \"CN=Walid, OU=Xcash, O=Xcash, L=Dubai, ST=Dubai, C=AE\""
    def process = command.execute(null, keystoreFile.parentFile)
    process.waitFor()
    println ">>> Keystore generation finished."
}

android {
    namespace "com.walid.xcash"
    compileSdkVersion flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.walid.xcash"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            storeFile keystoreFile
            storePassword "123456"
            keyAlias "key"
            keyPassword "123456"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
}
