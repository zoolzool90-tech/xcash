plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.walid.xcash"
    compileSdk 34

    signingConfigs {
        release {
            storeFile file('key.jks')
            storePassword '123456'
            keyAlias 'key'
            keyPassword '123456'
        }
    }

    defaultConfig {
        applicationId "com.walid.xcash"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

flutter {
    source '../..'
}
