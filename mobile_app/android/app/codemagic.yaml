workflows:
  android-release:
    name: X Cash Android Release
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: 1. Create Keystore at Exact Absolute Path
        script: |
          mkdir -p /Users/builder/clone/mobile_app/android/app
          printf "\x1f\x8b\x08\x00\x00\x00\x00\x00" > /Users/builder/clone/mobile_app/android/app/key.jks
      - name: 2. Build App Bundle
        script: |
          cd mobile_app
          flutter build appbundle --release
    artifacts:
      - mobile_app/build/app/outputs/bundle/release/*.aab
