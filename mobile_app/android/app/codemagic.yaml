workflows:
  android-release:
    name: X Cash Android Release
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: 1. Generate Keystore Dynamically
        script: |
          cd mobile_app/android/app
          $JAVA_HOME/bin/keytool -genkey -v -keystore key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass 123456 -keypass 123456 -dname "CN=Walid, OU=XCash, O=XCash, L=Dubai, ST=Dubai, C=AE"
      - name: 2. Build Signed App Bundle
        script: |
          cd mobile_app
          flutter build appbundle --release
    artifacts:
      - mobile_app/build/app/outputs/bundle/release/*.aab
