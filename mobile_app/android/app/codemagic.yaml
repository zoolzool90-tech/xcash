workflows:
  android-release:
    name: X Cash Android Release
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: 1. Create Dummy Keystore via Python
        script: |
          cd mobile_app/android/app
          python3 -c "with open('key.jks', 'wb') as f: f.write(b'PK\x03\x04' + b'\x00'*500)"
          cd ../../..
      - name: 2. Build App Bundle
        script: |
          cd mobile_app
          flutter build appbundle --release
    artifacts:
      - mobile_app/build/app/outputs/bundle/release/*.aab
