workflows:
  android-release:
    name: X Cash Android Release
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate debug keystore with absolute path
        script: |
          $JAVA_HOME/bin/keytool -genkey -v -keystore $FUTTER_ROOT/../../clone/mobile_app/android/app/debug.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US" || keytool -genkey -v -keystore mobile_app/android/app/debug.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias androiddebugkey -storepass android -keypass android -dname "CN=Android Debug, O=Android, C=US"
      - name: Build App Bundle
        script: |
          cd mobile_app
          flutter build appbundle --release
    artifacts:
      - mobile_app/build/app/outputs/bundle/release/*.aab
