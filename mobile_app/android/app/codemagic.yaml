workflows:
  android-release:
    name: X Cash Android Release
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Generate Keystore with Absolute Path
        script: |
          KEYSTORE_PATH="/Users/builder/clone/mobile_app/android/app/key.jks"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"
          keytool -genkey -v -keystore "$KEYSTORE_PATH" -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass 123456 -keypass 123456 -dname "CN=Android, OU=Android, O=Android, L=Cali, ST=CA, C=US"
          ls -la "$KEYSTORE_PATH"
      - name: Build Flutter App Bundle
        script: |
          cd mobile_app
          flutter build appbundle --release
    artifacts:
      - mobile_app/build/app/outputs/bundle/release/*.aab
