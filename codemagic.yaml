workflows:
  android-release-workflow:
    name: Android Release Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate Keystore and Build App
        script: |
          echo "--- 1. Generating Keystore ---"
          cd mobile_app/android/app
          rm -f key.jks
          keytool -genkey -v -keystore key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass 123456 -keypass 123456 -dname "CN=Walid, OU=Xcash, O=Xcash, L=Dubai, ST=Dubai, C=AE"
          
          echo "--- 2. Verifying Keystore File ---"
          ls -la key.jks
          
          echo "--- 3. Building Flutter App Bundle ---"
          cd ../../
          flutter pub get
          flutter build appbundle --release
    artifacts:
      - mobile_app/build/app/outputs/bundle/release/*.aab
