workflows:
  android-release-workflow:
    name: Android Release Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Generate Keystore & Build App Bundle
        script: |
          echo "Creating keystore directory if not exists..."
          mkdir -p mobile_app/android/app
          
          echo "Generating key.jks..."
          keytool -genkey -v -keystore mobile_app/android/app/key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key -storepass 123456 -keypass 123456 -dname "CN=Walid, OU=Xcash, O=Xcash, L=Dubai, ST=Dubai, C=AE"
          
          echo "Verifying file existence..."
          ls -la mobile_app/android/app/key.jks
          
          echo "Running Flutter build..."
          cd mobile_app
          flutter pub get
          flutter build appbundle --release
    artifacts:
      - mobile_app/build/app/outputs/bundle/release/*.aab
