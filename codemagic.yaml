workflows:
  android-release:
    name: X Cash Android Release
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Build App Bundle
        script: |
          cd mobile_app
          flutter build appbundle --release --android-skip-build-dependency-validation
    artifacts:
      - mobile_app/build/app/outputs/bundle/release/*.aab
