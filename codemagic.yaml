workflows:
  android-release-workflow:
    name: Android Release Workflow
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      android_signing:
        - keystore_reference
    scripts:
      - name: Install dependencies
        script: |
          cd mobile_app
          flutter pub get
      - name: Build Signed Android App Bundle
        script: |
          cd mobile_app
          flutter build appbundle --release
    artifacts:
      - mobile_app/build/app/outputs/bundle/release/*.aab
